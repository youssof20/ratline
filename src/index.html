<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ratline</title>
  <link rel="stylesheet" href="app.css" />
</head>
<body>
  <div id="boot" class="boot" aria-hidden="true">
    <div class="boot-brand">ratline</div>
    <div class="boot-bar"><i></i></div>
    <div class="boot-mark">&lt;?&gt;</div>
  </div>

  <div class="app" id="app">
    <header class="status" data-tauri-drag-region>
      <span class="brand" data-tauri-drag-region>ratline</span>
      <span id="fingerprint" class="fp dim" title="fingerprint — verify out of band">····</span>
      <span id="status-conv" class="status-conv dim"></span>
      <span id="path-label" class="path-label"></span>
      <span id="code-ttl" class="code-ttl"></span>
      <button type="button" id="btn-hide" class="win-btn" title="hide to tray" aria-label="hide to tray">×</button>
    </header>

    <main>
      <div id="log" class="log" aria-live="polite"></div>
      <div id="typing" class="typing dim" aria-live="polite"></div>
      <form id="composer">
        <span class="prompt" aria-hidden="true">&gt;</span>
        <textarea
          id="input"
          rows="1"
          autocomplete="off"
          spellcheck="false"
          placeholder="/connect  /join  /help"
          aria-label="message or command"
        ></textarea>
      </form>
    </main>
  </div>
  <script type="module" src="app.js"></script>
</body>
</html>
